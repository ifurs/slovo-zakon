<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Слово — закон</title>
  <meta name="description" content="Головоломка, де правила — це слова, які можна штовхати.">
  <link rel="preload" href="fonts/rubik-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1218">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Слово — закон">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <header class="top">
    <div class="title">
      <span class="logo">🦔</span>
      <div>
        <div id="level-num" class="level-num"></div>
        <h1 id="level-name"></h1>
      </div>
    </div>
    <nav class="actions">
      <button class="btn hdr-play" data-act="undo" title="Скасувати хід (Z)">↶ <span class="lbl">Скасувати</span></button>
      <button class="btn hdr-play" data-act="restart" title="Почати заново (R)">⟲ <span class="lbl">Заново</span></button>
      <button class="btn hdr-rules" data-act="rules" title="Правила і підказка">☷ <span class="lbl">Правила</span></button>
      <button class="btn" data-act="menu" title="Рівні (Esc)">☰ <span class="lbl">Рівні</span></button>
      <button class="btn icon" id="mute" data-act="mute"></button>
    </nav>
  </header>

  <main class="layout">
    <section class="stage">
      <canvas id="board" aria-label="Ігрове поле"></canvas>
      <div id="banner" class="banner" hidden></div>
      <div id="rotate-tip" class="rotate-tip" hidden>↻ Поверни телефон — поле буде більшим</div>
    </section>

    <aside class="side" id="side" aria-label="Правила і підказка">
      <div class="sheet-head">
        <b>Правила і підказка</b>
        <button class="btn" data-act="close-rules" aria-label="Закрити">✕</button>
      </div>
      <div class="card">
        <h3>Діючі правила</h3>
        <ul id="rules" class="rules"></ul>
      </div>
      <div class="card">
        <h3>Підказка</h3>
        <p id="hint" class="hint"></p>
      </div>
      <div class="card keys">
        <h3>Керування</h3>
        <p><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> рух</p>
        <p><kbd>Пробіл</kbd> чекати</p>
        <p><kbd>Z</kbd> скасувати · <kbd>R</kbd> заново</p>
        <p><kbd>Esc</kbd> рівні · <kbd>M</kbd> звук</p>
      </div>
    </aside>

    <div class="dpad" aria-label="Кнопки керування">
      <button class="pad-side rep" data-act="undo" aria-label="Скасувати хід"><span>↶</span><small>назад</small></button>
      <div class="cross">
        <button class="rep" data-dir="up" aria-label="Вгору">▲</button>
        <button class="rep" data-dir="left" aria-label="Вліво">◀</button>
        <button class="rep" data-dir="wait" aria-label="Чекати">●</button>
        <button class="rep" data-dir="right" aria-label="Вправо">▶</button>
        <button class="rep" data-dir="down" aria-label="Вниз">▼</button>
      </div>
      <button class="pad-side" data-act="rules" aria-label="Правила і підказка"><span>☷</span><small>правила</small></button>
    </div>
  </main>

  <div id="sheet-backdrop" class="sheet-backdrop" data-act="close-rules" hidden></div>

  <div id="menu" class="menu" hidden>
    <div class="menu-inner">
      <h2>Слово — закон</h2>
      <p class="lead">Правила гри складено зі слів. Штовхай слова — змінюй правила.</p>
      <div id="level-grid" class="level-grid"></div>
      <div class="menu-actions">
        <button id="menu-close" class="btn" data-act="close-menu">Повернутися до гри</button>
        <button id="menu-restart" class="btn" data-act="restart-from-menu">⟲ Почати рівень заново</button>
        <button id="install" class="btn" data-act="install" hidden>Встановити гру</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
